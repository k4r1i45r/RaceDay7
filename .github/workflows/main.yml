name: .NET Build and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore "RaceDay7.sln"
      
    - name: Build project
      run: dotnet build "RaceDay7.sln" --configuration Release --no-restore
      
    - name: Run Unit Tests
      run: dotnet test "RaceDay7.sln" --configuration Release --no-build --verbosity normal
